<script>
let D=null,requestedTab=new URLSearchParams(location.search).get('tab'),tab=['home','schedule','availability','requests','practice','manager','schedadmin'].includes(requestedTab)?requestedTab:'home',idToken='',punchBusy=false,scheduleViewMode='date',scheduleFilters={date:new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}),store:'',themes:[]},scheduleThemeMenuOpen=false,requestRows=[],virtualScheduleSlots=[],virtualScheduleDate='',virtualScheduleLoading=false,summaryMonth=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}).slice(0,7),monthSummary=null,managerMonth=summaryMonth,managerData=null,managerLoading=false,availabilityMonth=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}).slice(0,7),availabilityMode='',availabilitySelected=new Set(),availabilityBusy=false,meetingBusy=false;const app=document.getElementById('app');

const api=async(body)=>{const r=await fetch(CFG.SUPABASE_URL+'/functions/v1/staff-api',{method:'POST',headers:{'content-type':'application/json','apikey':CFG.SUPABASE_ANON_KEY,'authorization':'Bearer '+idToken},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Object.assign(new Error(x.error||'連線失敗'),{status:r.status,data:x});return x};
async function start(){
  if(!CFG.LINE_LIFF_ID){app.innerHTML='<div class="card"><h2>尚未連接 LINE 測試帳號</h2><p>程式已準備完成。建立 LIFF 後，只需把公開的 LIFF ID 填入 <b>web/config.js</b>。</p></div>';return}
  try{await liff.init({liffId:CFG.LINE_LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}idToken=liff.getIDToken();await load()}
  catch(e){app.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
async function load(){
  try{D=await api({action:'bootstrap'});monthSummary=await api({action:'monthly-summary',month:summaryMonth});document.getElementById('hello').textContent=D.me.name+'，今天也辛苦了';document.getElementById('nav').classList.remove('hidden');const canSwap=D.me.type==='full'||D.me.role==='manager',canSchedule=D.me.type==='full'||D.me.role==='manager';document.getElementById('swapNav').classList.toggle('hidden',!canSwap);document.getElementById('managerNav').classList.toggle('hidden',D.me.role!=='manager');document.getElementById('scheduleAdminNav').classList.toggle('hidden',!canSchedule);if(tab==='requests'&&!canSwap)tab='home';if(tab==='manager'&&D.me.role!=='manager')tab='home';if(tab==='schedadmin'&&!canSchedule)tab='home';if(tab==='practice'&&!D.me.canSchedulePractice)tab='home';show(tab)}
  catch(e){if(e.data?.error==='NOT_BOUND')bindView(e.data.displayName);else app.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
function bindView(name){document.getElementById('hello').textContent=name||'首次使用';app.innerHTML=`<div class="card"><h2>綁定員工身分</h2><p class="muted">請向管理員取得一次性驗證碼。請勿使用其他同事的驗證碼。</p><label>驗證碼</label><input id="bindCode" maxlength="12" autocomplete="one-time-code" style="text-transform:uppercase"><button style="width:100%;margin-top:12px" onclick="bind()">完成綁定</button></div>`}

const empName=id=>D.employees.find(e=>e.id===id)?.name||'未排人',storeName=id=>D.stores.find(s=>s.id===id)?.name||id,themeName=id=>D.themes.find(t=>t.id===id)?.name||'其他班';

const shiftName=s=>s.kind==='theme'?themeName(s.themeId):s.kind==='floor'?'駐店場控':s.kind==='cleaning'?'每周大清潔':s.kind==='practice'?`訓練場${s.trainingThemeId?'・'+themeName(s.trainingThemeId):''}`:s.kind==='meeting'?`開會（${meetingPayText(s)}）`:s.kind==='counter'?(s.storeId==='ms'?'謎先生櫃台':s.storeId==='dz'?'桌遊大忠店櫃台':'櫃台班'):'其他班別';

const myShifts=()=>D.shifts.filter(s=>!isCancelled(s)&&(s.assignments||[]).some(a=>a.empId===D.me.id));

let schDate=null,schWeekStart=null,schStore='',schThemes=[],schDepOnly=true,schSlot=null,schBusy=false,schShowCal=false,schCalY=0,schCalM=0,schPageMode='schedule';
const SCH_PAL=['#2563eb','#e11d48','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#059669','#ea580c','#4338ca','#b0885b','#0284c7'];
const SCH_WD=['週一','週二','週三','週四','週五','週六','週日'],SCH_WS=['一','二','三','四','五','六','日'];

function schMonday(d){const wd=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-wd);return m}

function schEmpAvail(e,date){if(e.availX&&e.availX[date])return e.availX[date];const wd=new Date(date+'T12:00:00+08:00').getDay(),wk=e.avail&&(e.avail[wd]||e.avail[String(wd)]);if(wk&&wk.on)return{on:true,start:wk.start,end:wk.end,weeklyDefault:true};if(wk&&wk.on===false)return{on:false,start:'',end:'',leaveType:'固定休',weeklyDefault:true};return e.type==='full'?{on:true,start:'09:00',end:'22:30',assumedAvailable:true}:{on:false,start:'',end:'',leaveType:'未回報',unreported:true}}
function schRoleSlots(s){const t=D.themes.find(x=>x.id===s.themeId),slots=(s.assignments||[]).map(a=>({role:a.role,empId:a.empId}));if(t&&String(t.name).startsWith('詭獄')&&!slots.some(x=>x.role==='場控'))slots.push({role:'場控',empId:''});return slots}

function todayWorkItems(){

function dailyPunchSegments(date){

  if(s.kind==='cleaning')return 'weekly_cleaning';if(s.kind==='practice')return 'practice';if(s.kind==='floor')return 'floor_support';
  const n=themeName(s.themeId),map={'外婆':'grandma','詭店':'haunted_shop','詭獄':'haunted_prison','屎力全開':'shit_power','詭廁':'haunted_toilet','越獄者':'escapee','孤兒怨':'orphan'};return map[n]||'';
}
function openPastCorrection(id){
  const s=D.shifts.find(x=>x.id===id);if(!s)return alert('找不到這個過去班次。');
  const role=(s.assignments||[]).find(a=>a.empId===D.me.id)?.role||'',npc=role.toUpperCase()==='NPC';
  show('home');const wrap=document.getElementById('homeCorrection');wrap.classList.remove('hidden');wrap.innerHTML=correctionCardHtml(s.date);const box=wrap.querySelector('.card');box.dataset.shiftId=s.id;
  document.getElementById('corDate').value=s.date;correctionDateChanged(s.date);selectCorrectionShift(s.id);
  document.getElementById('corReason').placeholder=`請說明 ${s.date} ${shiftName(s)} 未打卡原因`;box.scrollIntoView({behavior:'smooth'});
}
let scheduleRefreshing=false;
async function refreshScheduleSilently(){
  if(!D||tab!=='schedule'||document.hidden||scheduleRefreshing)return;scheduleRefreshing=true;
  try{await load()}catch(e){console.warn('schedule refresh failed',e)}finally{scheduleRefreshing=false}
}
setInterval(refreshScheduleSilently,60000);
setInterval(updateHomeDateTime,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshScheduleSilently()});
start();
</script></body></html>
